[project]
name = "excel-comparer"
version = "0.1.0"
description = "Compare Excel workbooks against a golden file."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
]

[project.scripts]
excel-comparer = "excel_comparer.cli:main"

[tool.setuptools.packages.find]
include = ["excel_comparer*", "webapp*"]
