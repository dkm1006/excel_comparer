# Active configuration for excel_comparer.
# Mirrors excel_comparer.example.toml — see that file for inline docs.


# ─── Top-level defaults ──────────────────────────────────────────────────────

[defaults]
data_start_row = 3
# Row-bound checks (everything except baseline_comparison) skip any row
# whose anchor column is empty. Column B holds the IRO name in this
# survey, so rows without one are treated as unused. Use `false` (or
# omit the key) to disable.
row_anchor_column = "B"


# ─── 1. Baseline (golden-workbook) comparison ────────────────────────────────

[[checks]]
name = "baseline_comparison"
float_tolerance = 0.0
categories = ["VALUE", "SHEET_MISSING", "SHEET_EXTRA"]

[checks.ranges]
"Introduction" = { skip = true }
"Impacts" = ["H", "O:Q", "S"]
"Risks & Opportunities" = ["N:O"]


# ─── 2. Rating-band checks ───────────────────────────────────────────────────

[[checks]]
name = "rating_band"
min_value = 1
max_value = 4
integers_only = true
[checks.ranges]
"Impacts" = ["O", "P", "Q", "S"]
"Risks & Opportunities" = ["N", "O"]


# ─── 3. Required-cells check ─────────────────────────────────────────────────

[[checks]]
name = "required_cells"
[checks.ranges]
"Impacts" = ["H:P", "S"]
"Risks & Opportunities" = ["H:O"]


# ─── 4. Minimum-text-length check ────────────────────────────────────────────

[[checks]]
name = "min_text_length"
min_chars = 250
[checks.ranges]
"Impacts" = ["U"]
"Risks & Opportunities" = ["Q"]


# ─── 5. Selection-required checks ────────────────────────────────────────────

[[checks]]
name = "selection_required"
forbidden_value = "No"
column_groups = [
    { label = "value_chain",  min_col = "I", max_col = "K" },
    { label = "time_horizon", min_col = "L", max_col = "N" },
]
[checks.ranges]
"Impacts" = ["I:N"]

[[checks]]
name = "selection_required"
forbidden_value = "No"
column_groups = [
    { label = "value_chain",  min_col = "H", max_col = "J" },
    { label = "time_horizon", min_col = "K", max_col = "M" },
]
[checks.ranges]
"Risks & Opportunities" = ["H:M"]


# ─── 6. Irremediable-character check ─────────────────────────────────────────

[[checks]]
name = "irremediable_character"
type_column = "G"
score_column = "Q"
positive_value = "Positive Impact"
negative_value = "Negative Impact"
auto_correction_value = "-"
valid_scores = [1, 2, 3, 4]
[checks.ranges]
"Impacts" = "A:Z"


# ─── Export settings ─────────────────────────────────────────────────────────

[export]
enabled = true
output_suffix = "_review"
highlight_color = "FFFF00"
correction_color = "B6FFB6"
flag_color = "FFFF00"
apply_corrections = true
header_row = 2
doc_column_header = "Review Documentation"
doc_column_width = 60.0
add_summary_sheet = false
summary_sheet_name = "Comparison Summary"

[export.doc_columns]
"Impacts" = "U"
"Risks & Opportunities" = "Q"


# ─── Text report settings ────────────────────────────────────────────────────

[report]
show_passed = true
group_by_sheet = true
group_by_check = true
